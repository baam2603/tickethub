name: TicketHub CI

on:
  push:
    branches:
      - unstable
      - stable
  pull_request:
    branches:
      - unstable
      - stable

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickethub
          POSTGRES_PASSWORD: tickethub_secret
          POSTGRES_DB: tickethub_ipn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tickethub:tickethub_secret@localhost:5432/tickethub_ipn_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: tickethub-super-secret-development-jwt-key-2026-min-32-chars
      ED25519_PRIVATE_KEY: MC4CAQAwBQYDK2VwBCIEIFXdummyed25519privatekeydevelopmentonly2026=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format
        run: pnpm format:check

      - name: Build shared package
        run: pnpm --filter @tickethub/shared build

      - name: Check lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit production dependencies
        run: |
          set +e
          pnpm audit --prod --audit-level=high --json > /tmp/audit-stdout.json 2> /tmp/audit-stderr.log
          AUDIT_EXIT=$?
          set -e
          node scripts/ci-audit-summary.mjs /tmp/audit-stdout.json /tmp/audit-stderr.log "$AUDIT_EXIT"

      - name: Check drizzle schema has no pending migration
        run: |
          pnpm --filter @tickethub/api db:generate
          git diff --exit-code -- apps/api/drizzle
          test -z "$(git ls-files --others --exclude-standard -- apps/api/drizzle)"

      - name: Run database migrations and seed
        run: |
          pnpm --filter @tickethub/api db:migrate
          pnpm --filter @tickethub/api db:seed

      - name: Run tests
        run: pnpm test

      - name: Build monorepo
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @tickethub/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          node apps/api/dist/main.js &
          pnpm --filter @tickethub/web start &
          sleep 5
          pnpm --filter @tickethub/web test:e2e

      - name: Build Docker image
        run: docker build -t tickethub-api:ci .

  publish:
    name: Publish Docker image to GHCR
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/unstable'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/tickethub-api:unstable
            ghcr.io/${{ steps.repo.outputs.owner }}/tickethub-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
